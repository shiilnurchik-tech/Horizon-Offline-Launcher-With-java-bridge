# This is an integration check, not a release of the Java Bridge client.
name: Java Bridge integration checks

on:
  push:
    branches: ['arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-bridge-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  HORIZON_TELEMETRY_URL: 'off'
  HORIZON_LAUNCHER_NO_SELF_UPDATE: '1'
  CARGO_TERM_COLOR: never

jobs:
  client-content-check:
    name: Client content integration (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      HORIZON_BRIDGE_PLATFORM: source
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: java-bridge-client-content
          cache-on-failure: true
      - name: Test mod biome and particle rendering support
        run: |
          cargo test --locked -p horizon-client-render --lib biome::mod_biomes::tests
          cargo test --locked -p horizon-client-render --lib particles::mod_particles::tests
          cargo test --locked -p horizon-client-render --lib streaming::mod_tickets::tests
          cargo test --locked -p horizon-client-render --lib datapack::mod_jars::tests
      - name: Check client library
        shell: bash
        run: |
          set +e
          cargo check --locked -p horizon-client-lib --no-default-features 2>&1 | tee "$RUNNER_TEMP/client-check.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            detail=$(tail -n 25 "$RUNNER_TEMP/client-check.log")
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\n'/'%0A'}
            echo "::error::$detail"
          fi
          exit "$status"
      - name: Test client content integration
        shell: bash
        run: |
          set +e
          cargo test --locked -p horizon-client-lib --no-default-features --lib mod_content::tests 2>&1 | tee "$RUNNER_TEMP/client-content-test.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            detail=$(tail -n 25 "$RUNNER_TEMP/client-content-test.log")
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\n'/'%0A'}
            echo "::error::$detail"
          fi
          exit "$status"
  jvm-runtime:
    name: JVM and Fabric fixture (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      HORIZON_BRIDGE_PLATFORM: source
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: java-bridge-runtime
          cache-on-failure: true
      - name: Test embedded JVM and stand-in Fabric mod
        shell: bash
        run: |
          set +e
          java -version
          javac -version || exit 1
          cargo test --locked -p horizon-jvm --test boot --test fabric 2>&1 | tee "$RUNNER_TEMP/jvm-runtime.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            detail=$(tail -n 35 "$RUNNER_TEMP/jvm-runtime.log")
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\n'/'%0A'}
            echo "::error::$detail"
          fi
          exit "$status"
  game-check:
    name: Game binary integration (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: java-bridge-game-check
          cache-on-failure: true
      - name: Check offline game binary
        shell: bash
        run: |
          set +e
          cargo check --locked -p horizon-client --no-default-features --bin horizon-client 2>&1 | tee "$RUNNER_TEMP/game-check.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            detail=$(tail -n 35 "$RUNNER_TEMP/game-check.log")
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\n'/'%0A'}
            echo "::error::$detail"
          fi
          exit "$status"
  jvm-check:
    name: Java Bridge crate (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      HORIZON_BRIDGE_PLATFORM: source
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: java-bridge-jvm
          cache-on-failure: true
      - name: Check the bridge crate
        shell: bash
        run: |
          set +e
          cargo check --locked -p horizon-jvm 2>&1 | tee "$RUNNER_TEMP/jvm-check.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            detail=$(tail -n 25 "$RUNNER_TEMP/jvm-check.log")
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\n'/'%0A'}
            detail=${detail//$'\r'/'%0D'}
            echo "::error::$detail"
          fi
          exit "$status"
      - name: Test the Java mod content porter
        shell: bash
        run: |
          set +e
          cargo test --locked -p horizon-port-pack --lib 2>&1 | tee "$RUNNER_TEMP/porter-test.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            detail=$(tail -n 25 "$RUNNER_TEMP/porter-test.log")
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\n'/'%0A'}
            echo "::error::$detail"
          fi
          exit "$status"
      - name: Test mod content declarations
        run: cargo test --locked -p horizon-mods --lib
      - name: Test mod worldgen seeds
        run: cargo test --locked -p horizon-core --lib noise_seed
      - name: Test mod OBJ texture slots
        run: cargo test --locked -p horizon-assets --lib obj_slots
      - name: Test streamed gameplay projection
        run: cargo test --locked -p horizon-world --lib level::data::streaming::tests
      - name: Test mod block collisions
        run: cargo test --locked -p horizon-world --test mod_block_collision
      - name: Test world update hook
        run: cargo test --locked -p horizon-world --lib a_set_block_names_the_position_whose_neighbours_it_updates
      - name: Test unsupported mod structures
        run: cargo test --locked -p horizon-world --lib worldgen::structure::start::tests::unsupported
      - name: Test in-memory and network framing
        run: cargo test --locked -p horizon-protocol --lib
      - name: Check Java path normalization
        run: cargo test --locked -p horizon-prepare --lib verbatim_drive_paths_lose_their_prefix
      - name: Report generated lockfile changes
        if: always()
        shell: bash
        run: |
          diff=$(git diff -- Cargo.lock)
          if [ -n "$diff" ]; then
            diff=${diff//'%'/'%25'}
            diff=${diff//$'\n'/'%0A'}
            echo "::warning::$diff"
          fi
  launcher-file-management:
    name: Fabric file management (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          key: java-bridge-integration-${{ matrix.os }}
          cache-on-failure: true
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: bash "$GITHUB_WORKSPACE/tools/ci/apt_install.sh" libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev
      - name: Test Fabric mod file management
        run: |
          set +e
          cargo test --release --locked --lib java_mods::tests 2>&1 | tee "$RUNNER_TEMP/java-mods-test.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            detail=$(tail -n 20 "$RUNNER_TEMP/java-mods-test.log")
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\n'/'%0A'}
            detail=${detail//$'\r'/'%0D'}
            echo "::error::$detail"
          fi
          exit "$status"
      - name: Test CLI and its incomplete-bridge warning
        run: cargo test --release --locked --test java_mods_cli
