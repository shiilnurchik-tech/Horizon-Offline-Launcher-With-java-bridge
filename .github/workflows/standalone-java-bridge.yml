# The pinned upstream client is patched for explicit offline opt-in; the launcher
# is built from this branch. These artifacts are experimental, not a signed release.
name: Offline launcher and Java Bridge beta

on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/standalone-java-bridge.yml', 'integration/**', 'launcher/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  HORIZON_TELEMETRY_URL: 'off'

jobs:
  bridge-client:
    name: Offline Java client (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            executable: horizon-client
          - name: windows-x64
            os: windows-latest
            executable: horizon-client.exe
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      HORIZON_BRIDGE_PLATFORM: source
      RUSTFLAGS: ${{ matrix.rustflags }}
    defaults:
      run:
        shell: bash
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
        with:
          path: integration-src
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: iaxivers/horizon-java-bridge
          ref: 99e8ba80497e0515909af4601a4b078020034d2c
          path: bridge
          persist-credentials: false
      - name: Apply the explicit offline mode patch
        run: git apply --unidiff-zero --check ../integration-src/integration/upstream-offline-java-mods.patch && git apply --unidiff-zero ../integration-src/integration/upstream-offline-java-mods.patch
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge
          key: standalone-java-client-${{ matrix.name }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev
      - name: Verify the pinned Fabric API release
        run: |
          python -c "import hashlib, io, json, pathlib, urllib.request, zipfile; line = [x for x in pathlib.Path('crates/horizon-jvm/fabric-api.tsv').read_text().splitlines() if x and not x.startswith('#')][0]; name, url, expected = line.split('\t'); assert name == 'fabric-api-0.166.2+26.3.jar'; data = urllib.request.urlopen(url, timeout=120).read(); assert hashlib.sha256(data).hexdigest() == expected; metadata = json.loads(zipfile.ZipFile(io.BytesIO(data)).read('fabric.mod.json')); assert metadata['id'] == 'fabric-api' and metadata['version'] == '0.166.2+26.3'"
      - name: Test selection of a player's Fabric API
        run: cargo test --locked -p horizon-jvm --lib player_fabric_api_is_chosen_by_metadata_and_duplicates_are_rejected
      - name: Test explicit offline opt-in and original ownership gate
        run: |
          set +e
          cargo test --locked -p horizon-jvm --lib gate::tests 2>&1 | tee "$RUNNER_TEMP/offline-gate-test.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            detail=$(tail -n 35 "$RUNNER_TEMP/offline-gate-test.log")
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\n'/'%0A'}
            detail=${detail//$'\r'/'%0D'}
            echo "::error::$detail"
          fi
          exit "$status"
      - name: Build patched client with Java mods
        run: |
          set +e
          cargo build --release --locked -p horizon-client --features java-mods --bin horizon-client 2>&1 | tee "$RUNNER_TEMP/bridge-build.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            detail=$(tail -n 35 "$RUNNER_TEMP/bridge-build.log")
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\n'/'%0A'}
            detail=${detail//$'\r'/'%0D'}
            echo "::error::$detail"
          fi
          exit "$status"
      - name: Check and stage the standalone client
        run: |
          set -euo pipefail
          binary="target/release/${{ matrix.executable }}"
          "$binary" --help | grep -q -- '--offline-java-mods'
          python tools/check_imports.py "$binary"
          test ! -e .local/bridge
          mkdir -p ../artifact-java
          cp "$binary" LICENSE THIRD_PARTY_NOTICES.md ../artifact-java/
          printf 'Upstream iaxivers/horizon-java-bridge commit 99e8ba80497e0515909af4601a4b078020034d2c\nBuilt with java-mods, HORIZON_BRIDGE_PLATFORM=source.\nPatched with the offline launcher fork’s explicit offline opt-in.\nRequires compatible prepared game resources, Java 25 JDK, and Fabric dependencies.\nOffline mod mode does not verify game ownership.\nMinecraft, Fabric and mod files are not included.\n' > ../artifact-java/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-java-client-${{ matrix.name }}
          path: artifact-java/
          if-no-files-found: error
          retention-days: 7

  offline-launcher:
    name: Offline launcher (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            executable: horizon-launcher
          - name: windows-x64
            os: windows-latest
            executable: horizon-launcher.exe
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      # Embedded into this beta binary; the runtime environment is not inherited by users.
      HORIZON_BRIDGE_BETA_NO_SELF_UPDATE: '1'
    defaults:
      run:
        shell: bash
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          key: standalone-offline-launcher-${{ matrix.name }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: bash "$GITHUB_WORKSPACE/tools/ci/apt_install.sh" libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev
      - name: Check launcher command reference
        if: runner.os == 'Linux'
        run: |
          HORIZON_WRITE_DOCS=1 cargo test --release --locked --bin horizon-launcher the_launcher_reference
          detail=$(git -C "$GITHUB_WORKSPACE" diff -- docs/launcher-commands.md)
          if [ -n "$detail" ]; then
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\n'/'%0A'}
            detail=${detail//$'\r'/'%0D'}
            echo "::error::$detail"
            exit 1
          fi
      - name: Test launcher
        run: |
          set +e
          if [ "$RUNNER_OS" = Windows ]; then
            cargo test --release --locked --bin horizon-launcher fabric_is_explicit_and_adds_only_the_offline_bridge_arguments 2>&1 | tee "$RUNNER_TEMP/launcher-tests.log"
          else
            cargo test --release --locked 2>&1 | tee "$RUNNER_TEMP/launcher-tests.log"
          fi
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            detail=$(tail -n 35 "$RUNNER_TEMP/launcher-tests.log")
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\n'/'%0A'}
            detail=${detail//$'\r'/'%0D'}
            echo "::error::$detail"
          fi
          exit "$status"
      - name: Verify beta self-update is disabled without a runtime setting
        run: |
          python -c "import os, subprocess; e = os.environ.copy(); e.pop('HORIZON_LAUNCHER_NO_SELF_UPDATE', None); e['HORIZON_EXPECT_BRIDGE_BETA'] = '1'; subprocess.run(['cargo', 'test', '--release', '--locked', '--lib', 'beta_build_never_self_updates'], env=e, check=True)"
      - name: Build offline launcher
        run: |
          set +e
          cargo build --release --locked 2>&1 | tee "$RUNNER_TEMP/launcher-build.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            detail=$(tail -n 35 "$RUNNER_TEMP/launcher-build.log")
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\n'/'%0A'}
            detail=${detail//$'\r'/'%0D'}
            echo "::error::$detail"
          fi
          exit "$status"
      - name: Check and stage launcher
        run: |
          set -euo pipefail
          binary="target/release/${{ matrix.executable }}"
          "$binary" --version
          mkdir -p ../artifact-launcher
          cp "$binary" ../artifact-launcher/
          printf 'Offline launcher built from this workflow run.\nUse play --fabric with the imported offline Java client.\nThe launcher will not self-update. Minecraft files are not included.\n' > ../artifact-launcher/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: offline-launcher-${{ matrix.name }}
          path: artifact-launcher/
          if-no-files-found: error
          retention-days: 7

  bundle:
    name: Experimental bundle (${{ matrix.name }})
    needs: [bridge-client, offline-launcher]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        name: [linux-x64, windows-x64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: standalone-java-client-${{ matrix.name }}
          path: java-client
      - uses: actions/download-artifact@v4
        with:
          name: offline-launcher-${{ matrix.name }}
          path: launcher-bin
      - name: Make paired archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir bundle
          if [ '${{ matrix.name }}' = linux-x64 ]; then
            cp java-client/horizon-client launcher-bin/horizon-launcher bundle/
            chmod 755 bundle/horizon-client bundle/horizon-launcher
          else
            cp java-client/horizon-client.exe launcher-bin/horizon-launcher.exe bundle/
          fi
          cp java-client/LICENSE java-client/THIRD_PARTY_NOTICES.md bundle/
          cp integration/README-ru.txt bundle/README-ru.txt
          if [ '${{ matrix.name }}' = linux-x64 ]; then
            tar -czf offline-java-bridge-beta-linux-x64.tar.gz -C bundle .
          else
            (cd bundle && zip -q -r ../offline-java-bridge-beta-windows-x64.zip .)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: offline-java-bridge-beta-${{ matrix.name }}
          path: offline-java-bridge-beta-*
          if-no-files-found: error
          retention-days: 7
