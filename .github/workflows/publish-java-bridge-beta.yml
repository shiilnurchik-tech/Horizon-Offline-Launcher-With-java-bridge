# One-off publication of the already tested, unsigned beta bundles. The fixed run and
# commit prevent a later build or a moving branch from silently changing the release.
name: Publish Java Bridge beta

on:
  # Manual retry only: automatic publication failed because GitHub denied the runner's
  # contents:write release permission. Do not publish again on unrelated branch pushes.
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: '43741554974'
      BUILD_COMMIT: 'c9a552bffaf7f001b329461e0d29af041403c64c'
      RELEASE_TAG: 'java-bridge-beta-2026.11.15-ui'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify original build and absence of release tag
        shell: bash
        run: |
          set -euo pipefail
          run=$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN")
          test "$(jq -r .head_sha <<< "$run")" = "$BUILD_COMMIT"
          test "$(jq -r .status <<< "$run")" = completed
          test "$(jq -r .conclusion <<< "$run")" = success
          # Never modify an existing release or tag from this workflow.
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo '::error::The release tag already exists; refusing to overwrite it.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: offline-java-bridge-beta-linux-x64
          path: release-files
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: offline-java-bridge-beta-windows-x64
          path: release-files
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
      - name: Publish prerelease after both files are uploaded
        shell: bash
        run: |
          set -euo pipefail
          cd release-files
          for file in offline-java-bridge-beta-linux-x64.tar.gz offline-java-bridge-beta-windows-x64.zip; do
            if [ ! -s "$file" ]; then echo "::error::Missing or empty $file"; ls -la; exit 1; fi
          done
          sha256sum offline-java-bridge-beta-linux-x64.tar.gz offline-java-bridge-beta-windows-x64.zip > SHA256SUMS.txt
          if ! output=$(gh release create "$RELEASE_TAG" --target "$BUILD_COMMIT" --title 'Horizon Offline + Java Bridge — beta с интерфейсом Fabric' --notes-file ../integration/release-notes-ui.md --prerelease --draft offline-java-bridge-beta-linux-x64.tar.gz offline-java-bridge-beta-windows-x64.zip SHA256SUMS.txt 2>&1); then
            output=${output//'%'/'%25'}; output=${output//$'\n'/'%0A'}; output=${output//$'\r'/'%0D'}
            echo "::error::$output"; exit 1
          fi
          if ! output=$(gh release edit "$RELEASE_TAG" --draft=false --latest=false 2>&1); then
            output=${output//'%'/'%25'}; output=${output//$'\n'/'%0A'}; output=${output//$'\r'/'%0D'}
            echo "::error::$output"; exit 1
          fi
