# One-off publication of the already tested, unsigned beta bundles. The fixed run and
# commit prevent a later build or a moving branch from silently changing the release.
name: Publish Java Bridge beta

on:
  push:
    branches: ['arena/fb746f0f-horizon-offline-launcher-with']
    paths: ['.github/workflows/publish-java-bridge-beta.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: '43811999426'
      BUILD_COMMIT: 'f0aab6ceeb8603bca22f4f646a3a0b0738faa778'
      RELEASE_TAG: 'java-bridge-beta-2026.11.15-update-fix'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for the fixed build to pass
        shell: bash
        run: gh run watch "$BUILD_RUN" --exit-status
      - name: Verify original build and existing draft
        shell: bash
        run: |
          set -euo pipefail
          run=$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN")
          test "$(jq -r .head_sha <<< "$run")" = "$BUILD_COMMIT"
          test "$(jq -r .status <<< "$run")" = completed
          test "$(jq -r .conclusion <<< "$run")" = success
          # Only the specifically prepared draft may be completed; never alter a published
          # release, an unrelated tag, or a draft belonging to a different source commit.
          release=$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,targetCommitish,assets)
          test "$(jq -r .isDraft <<< "$release")" = true
          test "$(jq -r .isPrerelease <<< "$release")" = true
          test "$(jq -r .targetCommitish <<< "$release")" = "$BUILD_COMMIT"
          test "$(jq '.assets | length' <<< "$release")" = 0
      - uses: actions/download-artifact@v4
        with:
          name: offline-java-bridge-beta-linux-x64
          path: release-files
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: offline-java-bridge-beta-windows-x64
          path: release-files
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
      - name: Publish prerelease after both files are uploaded
        shell: bash
        run: |
          set -euo pipefail
          cd release-files
          for file in offline-java-bridge-beta-linux-x64.tar.gz offline-java-bridge-beta-windows-x64.zip; do
            if [ ! -s "$file" ]; then echo "::error::Missing or empty $file"; ls -la; exit 1; fi
          done
          sha256sum offline-java-bridge-beta-linux-x64.tar.gz offline-java-bridge-beta-windows-x64.zip > SHA256SUMS.txt
          if ! output=$(gh release upload "$RELEASE_TAG" offline-java-bridge-beta-linux-x64.tar.gz offline-java-bridge-beta-windows-x64.zip SHA256SUMS.txt 2>&1); then
            output=${output//'%'/'%25'}; output=${output//$'\n'/'%0A'}; output=${output//$'\r'/'%0D'}
            echo "::error::$output"; exit 1
          fi
          if ! output=$(gh release edit "$RELEASE_TAG" --draft=false --latest=false 2>&1); then
            output=${output//'%'/'%25'}; output=${output//$'\n'/'%0A'}; output=${output//$'\r'/'%0D'}
            echo "::error::$output"; exit 1
          fi
